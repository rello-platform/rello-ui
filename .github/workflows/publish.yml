name: Publish to GitHub Packages

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          # The manifest gate compares against the newest v* tag STRICTLY BELOW
          # the one being pushed. Default depth-1 fetches no tags at all, so the
          # gate would find no baseline and exit 2 UNVERIFIED on every release.
          fetch-depth: 0

      # Backstop only. This guard sits on the REGISTRY path, and no consumer uses
      # it — measured 2026-08-20: of 403 @rello-platform/* dependency declarations
      # across 62 package.json files, 401 are `github:` git-refs and 2 are
      # workspace links; ZERO install from GitHub Packages. So refusing to publish
      # a mismatched tag does not protect anybody; .husky/pre-push does, by
      # refusing the tag before it exists.
      #
      # Kept anyway: it is the only detector for a tag created through the web UI
      # or pushed with --no-verify, and it costs nothing.
      #
      # Runs the SAME script as the hook so the two can never disagree.
      - name: Verify tag matches package.json version
        if: github.event_name == 'push'
        run: node scripts/check-version-tag.mjs "${GITHUB_REF_NAME}"

      # -- tag gate, pre-publish ------------------------------------------
      # The same gate the pre-push hook runs, fed the SAME stdin shape, so the
      # two can never disagree -- the principle the version-tag check above
      # already follows.
      #
      # This is genuine PRE-PUBLISH enforcement for the two packages that
      # actually publish to a registry. The other seven ship by git tag only,
      # so a bad tag there is inert until a consumer pins it; the post-hoc
      # detector covers those.
      #
      # Requires exit 0: STALE blocks, UNVERIFIED blocks, a regressed or
      # unresolvable manifest blocks. No "|| true" anywhere.
      - name: Tag gate - dist freshness + manifest regression
        run: |
          SHA=$(git rev-parse HEAD)
          printf 'refs/tags/%s %s refs/tags/%s %s\n' \
            "${GITHUB_REF_NAME}" "$SHA" "${GITHUB_REF_NAME}" "$SHA" \
            | npx --yes "github:rello-platform/scripts#v0.11.0" tag-dist-gate

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: https://npm.pkg.github.com

      - run: npm ci
      - run: npm run build
      - run: npm test -- --passWithNoTests
      - run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
